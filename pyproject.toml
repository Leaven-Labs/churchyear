[project]
name = "churchyear"
version = "1.0.0"
description = "The church year for Lutheran (ELCA) congregations: seasons, named days, colors and the Revised Common Lectionary year."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leaven Labs" }]
# ChurchRadio Studio runs on 3.11; ChurchRadio Manager on 3.12.
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Religion",
]

[project.urls]
Source = "https://github.com/Leaven-Labs/churchyear"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churchyear"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PTH", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
